<svg viewBox="0 0 770 210" role="img" aria-label="Residual stream writers that get orthogonalised" xmlns="http://www.w3.org/2000/svg" class="chart"><style data-standalone="1">svg{--bg:#fbfaf7;--fg:#1d1d1f;--muted:#5f6368;--line:#e3e0d8;--card:#ffffff;--accent:#9a4a00;--link:#0b57d0; --c1:#2f6db5;--c2:#2e8b57;--c3:#d2691e;--c4:#b8860b;--c5:#9aa0a6;--bad:#c0392b;--good:#2e8b57; --hl:#eef4fb;--warn:#fdf0e6;--code:#f2efe8;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}@media (prefers-color-scheme:dark){svg{--bg:#16171a;--fg:#e8e6e3;--muted:#a0a4aa;--line:#2e3036;--card:#1e2024;--accent:#f0a35e; --link:#8ab4f8;--c1:#6ea8ff;--c2:#5cc08a;--c3:#f08c4a;--c4:#e0b84a;--c5:#7d838b;--bad:#ff7b6b;--good:#5cc08a; --hl:#1d2a3a;--warn:#3a2a1d;--code:#24262b}}svg .ink{fill:var(--fg)} svg .muted{fill:var(--muted)} svg .accent{fill:var(--accent)} svg .bad{fill:var(--bad)} svg .on-bar{fill:#fff} svg .grid{stroke:var(--line);stroke-width:1} svg .axis{stroke:var(--muted);stroke-width:1.2} svg .axis.thin{stroke-width:.8} svg .mark{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 3} svg .box{fill:var(--card);stroke:var(--muted);stroke-width:1.2} svg .box.hl{fill:var(--hl);stroke:var(--c1)} svg .box.warn{fill:var(--warn);stroke:var(--bad)} svg .bad-fill{fill:var(--warn);stroke:var(--bad)} svg .good-fill{fill:var(--hl);stroke:var(--good)} svg .band{fill:var(--hl);stroke:var(--c1);stroke-dasharray:4 3} svg .arrow{stroke:var(--muted);stroke-width:1.6} svg .arrow.thin{stroke-width:1.1} svg .arrowhead{fill:var(--muted)} svg .stream{stroke:var(--c1);stroke-width:5;opacity:.45} svg .plus{fill:var(--card);stroke:var(--c1);stroke-width:1.4} svg .dot-base{fill:var(--c1)} svg .dot-new{fill:var(--c3)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><line x1="60" x2="720" y1="110" y2="110" class="stream"/><text x="390.0" y="140.0" text-anchor="middle" font-size="12" font-weight="400" class="muted" font-family="var(--sans)" >residual stream  h  (5120-d)</text><rect x="10" y="88" width="90" height="44" rx="8" class="box hl"/><text x="55.0" y="107.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >embedding</text><text x="55.0" y="123.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >E ← E − (Ed)dᵀ</text><rect x="115" y="14" width="110" height="44" rx="8" class="box hl"/><text x="170.0" y="33.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >attn / DeltaNet</text><text x="170.0" y="49.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >out_proj</text><line x1="170" y1="58" x2="170" y2="104" class="arrow" marker-end="url(#ah)"/><circle cx="170" cy="110" r="7" class="plus"/><text x="170.0" y="114.0" text-anchor="middle" font-size="12" font-weight="700" class="ink" font-family="var(--sans)" >+</text><rect x="245" y="14" width="110" height="44" rx="8" class="box hl"/><text x="300.0" y="33.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >MLP</text><text x="300.0" y="49.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >down_proj</text><line x1="300" y1="58" x2="300" y2="104" class="arrow" marker-end="url(#ah)"/><circle cx="300" cy="110" r="7" class="plus"/><text x="300.0" y="114.0" text-anchor="middle" font-size="12" font-weight="700" class="ink" font-family="var(--sans)" >+</text><rect x="415" y="14" width="110" height="44" rx="8" class="box hl"/><text x="470.0" y="33.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >attn / DeltaNet</text><text x="470.0" y="49.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >out_proj</text><line x1="470" y1="58" x2="470" y2="104" class="arrow" marker-end="url(#ah)"/><circle cx="470" cy="110" r="7" class="plus"/><text x="470.0" y="114.0" text-anchor="middle" font-size="12" font-weight="700" class="ink" font-family="var(--sans)" >+</text><rect x="545" y="14" width="110" height="44" rx="8" class="box hl"/><text x="600.0" y="33.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >MLP</text><text x="600.0" y="49.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >down_proj</text><line x1="600" y1="58" x2="600" y2="104" class="arrow" marker-end="url(#ah)"/><circle cx="600" cy="110" r="7" class="plus"/><text x="600.0" y="114.0" text-anchor="middle" font-size="12" font-weight="700" class="ink" font-family="var(--sans)" >+</text><text x="385.0" y="36.0" text-anchor="middle" font-size="16" font-weight="400" class="muted" font-family="var(--sans)" >· · ·</text><text x="235.0" y="84.0" text-anchor="middle" font-size="11" font-weight="400" class="muted" font-family="var(--sans)" >layer 0</text><text x="535.0" y="84.0" text-anchor="middle" font-size="11" font-weight="400" class="muted" font-family="var(--sans)" >layer 63</text><text x="742.0" y="150.0" text-anchor="end" font-size="11" font-weight="400" class="muted" font-family="var(--sans)" >norm → lm_head (reads only)</text><text x="380.0" y="180.0" text-anchor="middle" font-size="11.5" font-weight="600" class="ink" font-family="var(--sans)" >Every writer gets W ← W − d(dᵀW): no write can add a d-component, so h never contains d.</text><text x="380.0" y="198.0" text-anchor="middle" font-size="11.5" font-weight="400" class="muted" font-family="var(--sans)" >That is exactly what the inference hook x ← x − (x·d)d enforces after every layer.</text></svg>
