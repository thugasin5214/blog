-anchor="middle" font-size="11" font-weight="600" class="accent" font-family="var(--sans)" >_frozen_fast</text><text x="380.0" y="280.0" text-anchor="middle" font-size="11.5" font-weight="400" class="muted" font-family="var(--sans)" >Gradients only flow through the LoRA layers and above; frozen layers below only run forward.</text></svg>
