<svg viewBox="0 0 860 470" role="img" aria-label="Qwen3.8-27B architecture and one Gated DeltaNet layer" xmlns="http://www.w3.org/2000/svg" class="chart"><style data-standalone="1">svg{--bg:#fbfaf7;--fg:#1d1d1f;--muted:#5f6368;--line:#e3e0d8;--card:#ffffff;--accent:#9a4a00;--link:#0b57d0; --c1:#2f6db5;--c2:#2e8b57;--c3:#d2691e;--c4:#b8860b;--c5:#9aa0a6;--bad:#c0392b;--good:#2e8b57; --hl:#eef4fb;--warn:#fdf0e6;--code:#f2efe8;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}@media (prefers-color-scheme:dark){svg{--bg:#16171a;--fg:#e8e6e3;--muted:#a0a4aa;--line:#2e3036;--card:#1e2024;--accent:#f0a35e; --link:#8ab4f8;--c1:#6ea8ff;--c2:#5cc08a;--c3:#f08c4a;--c4:#e0b84a;--c5:#7d838b;--bad:#ff7b6b;--good:#5cc08a; --hl:#1d2a3a;--warn:#3a2a1d;--code:#24262b}}svg .ink{fill:var(--fg)} svg .muted{fill:var(--muted)} svg .accent{fill:var(--accent)} svg .bad{fill:var(--bad)} svg .on-bar{fill:#fff} svg .grid{stroke:var(--line);stroke-width:1} svg .axis{stroke:var(--muted);stroke-width:1.2} svg .axis.thin{stroke-width:.8} svg .mark{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 3} svg .box{fill:var(--card);stroke:var(--muted);stroke-width:1.2} svg .box.hl{fill:var(--hl);stroke:var(--c1)} svg .box.warn{fill:var(--warn);stroke:var(--bad)} svg .bad-fill{fill:var(--warn);stroke:var(--bad)} svg .good-fill{fill:var(--hl);stroke:var(--good)} svg .band{fill:var(--hl);stroke:var(--c1);stroke-dasharray:4 3} svg .arrow{stroke:var(--muted);stroke-width:1.6} svg .arrow.thin{stroke-width:1.1} svg .arrowhead{fill:var(--muted)} svg .stream{stroke:var(--c1);stroke-width:5;opacity:.45} svg .plus{fill:var(--card);stroke:var(--c1);stroke-width:1.4} svg .dot-base{fill:var(--c1)} svg .dot-new{fill:var(--c3)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><text x="150.0" y="20.0" text-anchor="middle" font-size="13" font-weight="700" class="ink" font-family="var(--sans)" >Qwen3.8-27B: 64 layers, hidden 5120</text><rect x="40" y="400" width="220" height="40" rx="8" class="box"/><text x="150.0" y="417.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Token embedding</text><text x="150.0" y="433.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >vocab 248k → 5120</text><line x1="150" y1="400" x2="150" y2="378" class="arrow" marker-end="url(#ah)"/><rect x="24" y="168" width="252" height="206" rx="10" class="band"/><text x="298.0" y="278.0" text-anchor="middle" font-size="15" font-weight="700" class="accent" font-family="var(--sans)" >× 16</text><rect x="40" y="200" width="150" height="34" rx="7" class="box"/><text x="115.0" y="221.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >Gated attention</text><rect x="196" y="200" width="56" height="34" rx="7" class="box"/><text x="224.0" y="221.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >MLP</text><rect x="40" y="242" width="150" height="34" rx="7" class="box hl"/><text x="115.0" y="263.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >Gated DeltaNet</text><rect x="196" y="242" width="56" height="34" rx="7" class="box"/><text x="224.0" y="263.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >MLP</text><rect x="40" y="284" width="150" height="34" rx="7" class="box hl"/><text x="115.0" y="305.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >Gated DeltaNet</text><rect x="196" y="284" width="56" height="34" rx="7" class="box"/><text x="224.0" y="305.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >MLP</text><rect x="40" y="326" width="150" height="34" rx="7" class="box hl"/><text x="115.0" y="347.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >Gated DeltaNet</text><rect x="196" y="326" width="56" height="34" rx="7" class="box"/><text x="224.0" y="347.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >MLP</text><text x="150.0" y="186.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >x += mixer(norm x); x += MLP(norm x)</text><line x1="150" y1="168" x2="150" y2="148" class="arrow" marker-end="url(#ah)"/><rect x="40" y="104" width="220" height="40" rx="8" class="box"/><text x="150.0" y="121.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >RMSNorm → LM head</text><text x="150.0" y="137.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >5120 → 248k logits</text><text x="150.0" y="62.0" text-anchor="middle" font-size="11.5" font-weight="600" class="accent" font-family="var(--sans)" >48 × Gated DeltaNet (linear attention)</text><text x="150.0" y="78.0" text-anchor="middle" font-size="11" font-weight="400" class="muted" font-family="var(--sans)" >16 × gated full attention: 24 Q / 4 KV heads, dim 256</text><text x="150.0" y="93.0" text-anchor="middle" font-size="11" font-weight="400" class="muted" font-family="var(--sans)" >MLP: SwiGLU 5120 → 17408 → 5120 (dense)</text><rect x="320" y="34" width="528" height="424" rx="10" class="box"/><text x="584.0" y="56.0" text-anchor="middle" font-size="13" font-weight="700" class="ink" font-family="var(--sans)" >One Gated DeltaNet layer</text><rect x="504" y="68" width="160" height="30" rx="8" class="box"/><text x="584.0" y="87.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >input x (5120)</text><rect x="336" y="118" width="160" height="30" rx="8" class="box"/><text x="416.0" y="137.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >in_proj_qkv</text><line x1="584" y1="98" x2="416.0" y2="114" class="arrow thin" marker-end="url(#ah)"/><rect x="506" y="118" width="100" height="30" rx="8" class="box"/><text x="556.0" y="137.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >in_proj_a</text><line x1="584" y1="98" x2="556.0" y2="114" class="arrow thin" marker-end="url(#ah)"/><rect x="620" y="118" width="100" height="30" rx="8" class="box"/><text x="670.0" y="137.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >in_proj_b</text><line x1="584" y1="98" x2="670.0" y2="114" class="arrow thin" marker-end="url(#ah)"/><rect x="734" y="118" width="100" height="30" rx="8" class="box"/><text x="784.0" y="137.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >in_proj_z</text><line x1="584" y1="98" x2="784.0" y2="114" class="arrow thin" marker-end="url(#ah)"/><rect x="336" y="166" width="160" height="44" rx="8" class="box"/><text x="416.0" y="185.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >causal conv1d, k = 4</text><text x="416.0" y="201.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >+ SiLU (local mixing)</text><line x1="416" y1="148" x2="416" y2="162" class="arrow thin" marker-end="url(#ah)"/><rect x="336" y="228" width="160" height="50" rx="8" class="box"/><text x="416.0" y="250.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >q, k: 16 heads × 128</text><text x="416.0" y="266.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >L2-normalised; v: 48 × 128</text><line x1="416" y1="210" x2="416" y2="224" class="arrow thin" marker-end="url(#ah)"/><rect x="506" y="166" width="100" height="44" rx="8" class="box"/><text x="556.0" y="185.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >decay α_t</text><text x="556.0" y="201.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >exp(−e^A·softplus)</text><rect x="620" y="166" width="100" height="44" rx="8" class="box"/><text x="670.0" y="185.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >write β_t</text><text x="670.0" y="201.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >sigmoid(b)</text><line x1="556" y1="148" x2="556" y2="162" class="arrow thin" marker-end="url(#ah)"/><line x1="670" y1="148" x2="670" y2="162" class="arrow thin" marker-end="url(#ah)"/><rect x="336" y="296" width="384" height="78" rx="8" class="box hl"/><text x="528.0" y="318.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >delta-rule state update, per value head</text><text x="528.0" y="340.0" text-anchor="middle" font-size="12.5" font-weight="600" class="accent" font-family="var(--sans)" >S_t = α_t · S_{t−1} (I − β_t k_t k_tᵀ) + β_t v_t k_tᵀ</text><text x="528.0" y="361.0" text-anchor="middle" font-size="11" font-weight="400" class="muted" font-family="var(--sans)" >o_t = S_t q_t     state S: 48 × 128 × 128, fixed size</text><line x1="416" y1="278" x2="416" y2="292" class="arrow thin" marker-end="url(#ah)"/><line x1="556" y1="210" x2="556" y2="292" class="arrow thin" marker-end="url(#ah)"/><line x1="670" y1="210" x2="670" y2="292" class="arrow thin" marker-end="url(#ah)"/><rect x="336" y="392" width="384" height="30" rx="8" class="box"/><text x="528.0" y="411.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >RMSNorm(o) · SiLU(z)  →  out_proj (6144 → 5120)</text><line x1="528" y1="374" x2="528" y2="388" class="arrow thin" marker-end="url(#ah)"/><path d="M784,148 L784,407 L724,407" fill="none" class="arrow thin" marker-end="url(#ah)"/><text x="790.0" y="280.0" text-anchor="start" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" transform="rotate(90 790 280)">output gate z</text><text x="336.0" y="444.0" text-anchor="start" font-size="10.5" font-weight="600" class="bad" font-family="var(--sans)" >training: the recurrence over t is the part with no backward kernel in mlx-lm</text></svg>
