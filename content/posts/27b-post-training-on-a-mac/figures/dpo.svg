<svg viewBox="0 0 760 170" role="img" aria-label="DPO two-pass exact gradient" xmlns="http://www.w3.org/2000/svg" class="chart"><style data-standalone="1">svg{--bg:#fbfaf7;--fg:#1d1d1f;--muted:#5f6368;--line:#e3e0d8;--card:#ffffff;--accent:#9a4a00;--link:#0b57d0; --c1:#2f6db5;--c2:#2e8b57;--c3:#d2691e;--c4:#b8860b;--c5:#9aa0a6;--bad:#c0392b;--good:#2e8b57; --hl:#eef4fb;--warn:#fdf0e6;--code:#f2efe8;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}@media (prefers-color-scheme:dark){svg{--bg:#16171a;--fg:#e8e6e3;--muted:#a0a4aa;--line:#2e3036;--card:#1e2024;--accent:#f0a35e; --link:#8ab4f8;--c1:#6ea8ff;--c2:#5cc08a;--c3:#f08c4a;--c4:#e0b84a;--c5:#7d838b;--bad:#ff7b6b;--good:#5cc08a; --hl:#1d2a3a;--warn:#3a2a1d;--code:#24262b}}svg .ink{fill:var(--fg)} svg .muted{fill:var(--muted)} svg .accent{fill:var(--accent)} svg .bad{fill:var(--bad)} svg .on-bar{fill:#fff} svg .grid{stroke:var(--line);stroke-width:1} svg .axis{stroke:var(--muted);stroke-width:1.2} svg .axis.thin{stroke-width:.8} svg .mark{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 3} svg .box{fill:var(--card);stroke:var(--muted);stroke-width:1.2} svg .box.hl{fill:var(--hl);stroke:var(--c1)} svg .box.warn{fill:var(--warn);stroke:var(--bad)} svg .bad-fill{fill:var(--warn);stroke:var(--bad)} svg .good-fill{fill:var(--hl);stroke:var(--good)} svg .band{fill:var(--hl);stroke:var(--c1);stroke-dasharray:4 3} svg .arrow{stroke:var(--muted);stroke-width:1.6} svg .arrow.thin{stroke-width:1.1} svg .arrowhead{fill:var(--muted)} svg .stream{stroke:var(--c1);stroke-width:5;opacity:.45} svg .plus{fill:var(--card);stroke:var(--c1);stroke-width:1.4} svg .dot-base{fill:var(--c1)} svg .dot-new{fill:var(--c3)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><rect x="10" y="20" width="200" height="60" rx="8" class="box"/><text x="110.0" y="47.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Pass 0: forward, no grad</text><text x="110.0" y="63.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >log p(y_c), log p(y_r)</text><rect x="270" y="20" width="210" height="60" rx="8" class="box"/><text x="375.0" y="47.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >4 scalars → coefficients</text><text x="375.0" y="63.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >g_c = ∂L/∂ℓ_c,  g_r = ∂L/∂ℓ_r</text><rect x="540" y="4" width="210" height="40" rx="8" class="box hl"/><text x="645.0" y="28.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Pass 1: backward g_c · ∇ℓ_c</text><rect x="540" y="56" width="210" height="40" rx="8" class="box hl"/><text x="645.0" y="80.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Pass 2: backward g_r · ∇ℓ_r</text><line x1="210" y1="50" x2="266" y2="50" class="arrow" marker-end="url(#ah)"/><line x1="480" y1="44" x2="536" y2="26" class="arrow" marker-end="url(#ah)"/><line x1="480" y1="56" x2="536" y2="76" class="arrow" marker-end="url(#ah)"/><rect x="10" y="112" width="200" height="44" rx="8" class="box"/><text x="110.0" y="131.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Reference log p</text><text x="110.0" y="147.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >pre-computed once, cached</text><line x1="110" y1="112" x2="300" y2="82" class="arrow" marker-end="url(#ah)" stroke-dasharray="5 4"/><text x="240.0" y="132.0" text-anchor="start" font-size="11.5" font-weight="400" class="muted" font-family="var(--sans)" >Only one sequence is ever on the autograd tape,</text><text x="240.0" y="150.0" text-anchor="start" font-size="11.5" font-weight="400" class="muted" font-family="var(--sans)" >so peak memory = single-sequence SFT.</text></svg>
