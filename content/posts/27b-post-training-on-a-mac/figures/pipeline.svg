<svg viewBox="0 0 860 290" role="img" aria-label="Pipeline overview: training path and no-training path" xmlns="http://www.w3.org/2000/svg" class="chart"><style data-standalone="1">svg{--bg:#fbfaf7;--fg:#1d1d1f;--muted:#5f6368;--line:#e3e0d8;--card:#ffffff;--accent:#9a4a00;--link:#0b57d0; --c1:#2f6db5;--c2:#2e8b57;--c3:#d2691e;--c4:#b8860b;--c5:#9aa0a6;--bad:#c0392b;--good:#2e8b57; --hl:#eef4fb;--warn:#fdf0e6;--code:#f2efe8;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif; --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}@media (prefers-color-scheme:dark){svg{--bg:#16171a;--fg:#e8e6e3;--muted:#a0a4aa;--line:#2e3036;--card:#1e2024;--accent:#f0a35e; --link:#8ab4f8;--c1:#6ea8ff;--c2:#5cc08a;--c3:#f08c4a;--c4:#e0b84a;--c5:#7d838b;--bad:#ff7b6b;--good:#5cc08a; --hl:#1d2a3a;--warn:#3a2a1d;--code:#24262b}}svg .ink{fill:var(--fg)} svg .muted{fill:var(--muted)} svg .accent{fill:var(--accent)} svg .bad{fill:var(--bad)} svg .on-bar{fill:#fff} svg .grid{stroke:var(--line);stroke-width:1} svg .axis{stroke:var(--muted);stroke-width:1.2} svg .axis.thin{stroke-width:.8} svg .mark{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:4 3} svg .box{fill:var(--card);stroke:var(--muted);stroke-width:1.2} svg .box.hl{fill:var(--hl);stroke:var(--c1)} svg .box.warn{fill:var(--warn);stroke:var(--bad)} svg .bad-fill{fill:var(--warn);stroke:var(--bad)} svg .good-fill{fill:var(--hl);stroke:var(--good)} svg .band{fill:var(--hl);stroke:var(--c1);stroke-dasharray:4 3} svg .arrow{stroke:var(--muted);stroke-width:1.6} svg .arrow.thin{stroke-width:1.1} svg .arrowhead{fill:var(--muted)} svg .stream{stroke:var(--c1);stroke-width:5;opacity:.45} svg .plus{fill:var(--card);stroke:var(--c1);stroke-width:1.4} svg .dot-base{fill:var(--c1)} svg .dot-new{fill:var(--c3)}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs><text x="12.0" y="24.0" text-anchor="start" font-size="12" font-weight="700" class="accent" font-family="var(--sans)" >Training path</text><rect x="12" y="40" width="150" height="52" rx="8" class="box"/><text x="87.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Base model</text><text x="87.0" y="79.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >Qwen3.8-27B, 4-bit</text><rect x="172" y="40" width="150" height="52" rx="8" class="box"/><text x="247.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >SFT (QLoRA)</text><text x="247.0" y="79.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >top-8 layers, seq 1024</text><line x1="162" y1="66" x2="168" y2="66" class="arrow" marker-end="url(#ah)"/><rect x="342" y="40" width="150" height="52" rx="8" class="box"/><text x="417.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Pick checkpoint</text><text x="417.0" y="79.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >by behaviour, not loss</text><line x1="322" y1="66" x2="338" y2="66" class="arrow" marker-end="url(#ah)"/><rect x="512" y="40" width="150" height="52" rx="8" class="box"/><text x="587.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >DPO</text><text x="587.0" y="79.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >on-policy pairs</text><line x1="492" y1="66" x2="508" y2="66" class="arrow" marker-end="url(#ah)"/><rect x="682" y="40" width="166" height="52" rx="8" class="box hl"/><text x="765.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Mixed-precision fuse</text><text x="765.0" y="79.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >LoRA layers 8-bit</text><line x1="662" y1="66" x2="678" y2="66" class="arrow" marker-end="url(#ah)"/><rect x="172" y="112" width="490" height="34" rx="8" class="band"/><text x="417.0" y="134.0" text-anchor="middle" font-size="12" font-weight="600" class="ink" font-family="var(--sans)" >Evaluation harness: 600-token generations × 3 seeds → 4-label judge</text><line x1="247" y1="108" x2="247" y2="96" class="arrow thin" marker-end="url(#ah)"/><line x1="417" y1="108" x2="417" y2="96" class="arrow thin" marker-end="url(#ah)"/><line x1="587" y1="108" x2="587" y2="96" class="arrow thin" marker-end="url(#ah)"/><rect x="682" y="112" width="166" height="44" rx="8" class="box"/><text x="765.0" y="131.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >LM Studio / agent</text><text x="765.0" y="147.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >MLX engine</text><line x1="765" y1="96" x2="765" y2="108" class="arrow" marker-end="url(#ah)"/><text x="12.0" y="186.0" text-anchor="start" font-size="12" font-weight="700" class="accent" font-family="var(--sans)" >No-training path</text><rect x="12" y="200" width="150" height="52" rx="8" class="box"/><text x="87.0" y="230.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Base model</text><rect x="172" y="200" width="150" height="52" rx="8" class="box"/><text x="247.0" y="223.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Refusal direction</text><text x="247.0" y="239.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >category ⟂ general harm</text><line x1="162" y1="226" x2="168" y2="226" class="arrow" marker-end="url(#ah)"/><rect x="342" y="200" width="150" height="52" rx="8" class="box"/><text x="417.0" y="223.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Inference hook</text><text x="417.0" y="239.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >x ← x − (x·d)d</text><line x1="322" y1="226" x2="338" y2="226" class="arrow" marker-end="url(#ah)"/><rect x="512" y="200" width="150" height="52" rx="8" class="box"/><text x="587.0" y="223.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Bake into weights</text><text x="587.0" y="239.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >129 matrices, 8-bit</text><line x1="492" y1="226" x2="508" y2="226" class="arrow" marker-end="url(#ah)"/><rect x="682" y="200" width="166" height="52" rx="8" class="box warn"/><text x="765.0" y="223.0" text-anchor="middle" font-size="12.5" font-weight="600" class="ink" font-family="var(--sans)" >Safety gate</text><text x="765.0" y="239.0" text-anchor="middle" font-size="10.5" font-weight="400" class="muted" font-family="var(--sans)" >protected refusals kept?</text><line x1="662" y1="226" x2="678" y2="226" class="arrow" marker-end="url(#ah)"/><text x="765.0" y="274.0" text-anchor="middle" font-size="11.5" font-weight="600" class="bad" font-family="var(--sans)" >failed → not shipped (§11)</text></svg>
