<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
{% block meta %}{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="{{ root }}assets/style.css">
{% block head %}{% endblock %}
</head>
<body><header class="site"><a href="{{ root }}">← {{ site.title }}</a></header>
<main>{% block main %}{% endblock %}</main>
<footer>© {{ year }} {{ site.author }}. {{ site.footer }}</footer>
{% if dev %}<script src="/__livereload.js"></script>{% endif %}
</body></html>
